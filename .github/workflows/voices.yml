name: Render natural offline documentary voices
on:
  push:
    branches: [main]
    paths:
      - 'tools/render_kokoro.py'
      - '.github/workflows/voices.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline narration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx>=0.6.0' soundfile numpy
          ffmpeg -version | head -n 1
      - name: Verify 12 chapters and all 36 researched beats
        run: python tools/render_kokoro.py --dry-run
      - name: Download permissively licensed Kokoro weights and voice vectors
        run: |
          curl -fsSL --retry 5 --retry-delay 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fsSL --retry 5 --retry-delay 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c %s kokoro-v1.0.onnx)" -gt 100000000
          test "$(stat -c %s voices-v1.0.bin)" -gt 10000000
      - name: Generate 12 male documentary chapters and 7 female guides
        run: python tools/render_kokoro.py
      - name: Validate audio and timestamp tracks
        run: |
          test "$(find public/audio -maxdepth 1 -name 'male-*.mp3' | wc -l)" -eq 12
          test "$(find public/audio -maxdepth 1 -name 'female-*.mp3' | wc -l)" -eq 7
          test "$(find public/audio -maxdepth 1 -name '*.vtt' | wc -l)" -eq 19
          for audio in public/audio/*.mp3; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$audio" | grep -q duration=
          done
      - name: Commit redistributable narrated media
        run: |
          git config user.name "Beyond Gravity Studio"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/*.mp3 public/audio/*.vtt
          if git diff --cached --quiet; then
            echo "No new media to commit"
          else
            git commit -m "assets: locally rendered Kokoro documentary narration and aligned captions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
