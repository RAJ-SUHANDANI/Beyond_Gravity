name: Build, typecheck & browser QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
